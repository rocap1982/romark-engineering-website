name: Uptime check

# Polls the live site. On failure it opens (or updates) an issue titled
# "Site down: romarkengineering.co.uk" — GitHub emails the repo owner — and
# closes it when the site answers again. No third-party account involved.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe
        id: probe
        shell: bash
        run: |
          ok=0
          for i in 1 2 3; do
            body=$(curl -sS -m 20 -w '\n%{http_code}' https://romarkengineering.co.uk/ || true)
            code=$(printf '%s' "$body" | tail -n1)
            if [ "$code" = "200" ] && printf '%s' "$body" | grep -q 'Romark Engineering'; then ok=1; break; fi
            echo "attempt $i: HTTP ${code:-none}"; sleep 20
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "code=${code:-none}" >> "$GITHUB_OUTPUT"
      - name: Open or close the alert issue
        uses: actions/github-script@v9
        env:
          OK: ${{ steps.probe.outputs.ok }}
          CODE: ${{ steps.probe.outputs.code }}
        with:
          script: |
            const title = 'Site down: romarkengineering.co.uk';
            const { owner, repo } = context.repo;
            const open = (await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'uptime' })).data
              .find(i => i.title === title);
            const now = new Date().toISOString();
            if (process.env.OK !== '1') {
              const body = `Probe failed at ${now} (last HTTP status: ${process.env.CODE}). Three attempts, 20 s apart.\n\nCheck Railway: https://railway.com/project/e17bd70c-90b4-4f7a-81db-5621dcdb39dc`;
              if (open) await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body });
              else await github.rest.issues.create({ owner, repo, title, body, labels: ['uptime'] });
              core.setFailed('Site is down');
            } else if (open) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body: `Back up at ${now}.` });
              await github.rest.issues.update({ owner, repo, issue_number: open.number, state: 'closed' });
            }
