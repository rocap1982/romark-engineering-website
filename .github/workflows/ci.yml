name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: Railway's "Wait for CI" skips a cancelled suite.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro check
      - run: npm run build
      - name: Smoke-test the built server
        run: |
          node dist/server/entry.mjs & sleep 3
          for p in / /laser-profiling /contact-us /sheet-metal-fabrication-essex /sitemap-index.xml /robots.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:4321$p")
            echo "$p -> $code"; [ "$code" = "200" ] || exit 1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4321/no-such-page)
          echo "/no-such-page -> $code"; [ "$code" = "404" ] || exit 1
